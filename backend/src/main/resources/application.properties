spring.application.name=backend
server.port=8080

# Read the same .env file that Docker uses (works from backend/ or the repo root)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:citewise}
spring.datasource.username=${POSTGRES_USER:citewise}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=uploads

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000